<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
// Theo dõi vị trí liên tục (navigator.geolocation.watchPosition) và gửi về Streamlit
// mỗi khi khách đi được >= min_move_m mét, hoặc tối thiểu mỗi resend_s giây.
(function () {
  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), '*');
  }
  function setValue(v) { send('streamlit:setComponentValue', { value: v, dataType: 'json' }); }
  function dist(a, b) {
    var R = 6371000, toRad = Math.PI / 180;
    var dLat = (b.latitude - a.latitude) * toRad, dLng = (b.longitude - a.longitude) * toRad;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a.latitude * toRad) * Math.cos(b.latitude * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  var args = { min_move_m: 3, resend_s: 30 }, started = false, last = null, lastT = 0;
  function start() {
    if (started) return;
    started = true;
    if (!navigator.geolocation) { setValue({ error: { code: 0, message: 'Geolocation not supported' } }); return; }
    navigator.geolocation.watchPosition(function (p) {
      var c = { latitude: p.coords.latitude, longitude: p.coords.longitude, accuracy: p.coords.accuracy,
                heading: p.coords.heading, speed: p.coords.speed };
      var now = Date.now();
      if (!last || dist(last, c) >= args.min_move_m || now - lastT > args.resend_s * 1000) {
        last = c; lastT = now;
        setValue({ coords: c, timestamp: p.timestamp });
      }
    }, function (err) {
      setValue({ error: { code: err.code, message: err.message } });
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  }
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'streamlit:render') {
      if (e.data.args) { for (var k in e.data.args) args[k] = e.data.args[k]; }
      send('streamlit:setFrameHeight', { height: 0 });
      start();
    }
  });
  send('streamlit:componentReady', { apiVersion: 1 });
})();
</script>
</body>
</html>
